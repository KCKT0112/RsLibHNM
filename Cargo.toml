[package]
name = "rs-libhnm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Clean-vocal harmonic-plus-noise analysis and synthesis"
license = "Apache-2.0"

[lib]
name = "rs_libhnm"
path = "src/lib.rs"

[[bin]]
name = "rsLibHNM"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
nalgebra = "0.34"
num-complex = { version = "0.4", features = ["serde"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
rand = "0.8"
rayon = "1"
rand_chacha = "0.3"
rand_distr = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
